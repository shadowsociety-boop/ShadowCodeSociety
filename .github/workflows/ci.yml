name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Validate, Typecheck & Compile ─────────────────
  validate-and-compile:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── Server Validation ──
      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: ./server
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Typecheck & Compile Server
        working-directory: ./server
        run: npm run build

      # ── Client Validation ──
      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Typecheck & Build Client
        working-directory: ./client
        run: npm run build

  # ── 2. Docker Images Build Verification ──────────────
  docker-build-check:
    name: Docker Build Verification
    needs: validate-and-compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: shadow-code-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: shadow-code-client:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
